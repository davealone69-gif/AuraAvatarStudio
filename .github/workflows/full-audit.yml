name: Full Repository Audit

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Whole repository audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        if: ${{ hashFiles('build.gradle*') != '' }}
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Locate Android SDK
        if: ${{ hashFiles('build.gradle*') != '' }}
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android SDK packages
        if: ${{ hashFiles('build.gradle*') != '' }}
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle
        if: ${{ hashFiles('build.gradle*') != '' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Gradle audit and build
        if: ${{ hashFiles('build.gradle*') != '' }}
        shell: bash
        run: |
          set -o pipefail
          gradle lint test assembleDebug --stacktrace --console=plain
      - name: Node audit and test
        if: ${{ hashFiles('package.json') != '' }}
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high || true
          npm run test --if-present
          npm run lint --if-present
          npm run build --if-present
      - name: Python syntax audit
        if: ${{ hashFiles('**/*.py') != '' }}
        shell: bash
        run: python -m compileall -q .
